name: gift-tracker

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gift-tracker-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - gift_tracker_sql_data:/var/opt/mssql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: gift-tracker-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gift_tracker_keycloak_data:/opt/keycloak/data

volumes:
  gift_tracker_sql_data:
  gift_tracker_keycloak_data:
